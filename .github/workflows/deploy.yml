name: Deploy

on:
  push:
    branches: [main, staging]

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    if: github.repository == 'tonywambua68-svg/websiteV1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and production build check
        run: npm run build:check

      - name: Report branch being tested
        run: echo "Branch: ${{ github.ref_name }} — build verified, not deploying (Cloudflare Workers Builds deploys)"
